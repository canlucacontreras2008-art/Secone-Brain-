<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Secone Brain — Memory Graph</title>
<style>
  :root {
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255, 255, 255, 0.10);
    --fact: #8a8a86;
    --lesson: #5fa83d;
    --task: #3987e5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
    z-index: 2;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    color: var(--text-primary);
  }

  header h1 span {
    color: var(--text-muted);
    font-weight: 400;
  }

  #search {
    flex: 1 1 220px;
    min-width: 160px;
    max-width: 360px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    padding: 6px 10px;
    font-size: 13px;
  }

  #search::placeholder { color: var(--text-muted); }
  #search:focus { outline: none; border-color: var(--text-secondary); }

  .legend {
    display: flex;
    gap: 6px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-secondary);
    font-size: 12px;
    padding: 5px 10px 5px 8px;
    cursor: pointer;
  }

  .legend-item.off { opacity: 0.35; }
  .legend-item:hover { border-color: var(--text-secondary); }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    flex: none;
  }

  .dot.fact { background: var(--fact); }
  .dot.lesson { background: var(--lesson); }
  .dot.task { background: var(--task); }

  #stats {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  main {
    position: relative;
    flex: 1;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    background: var(--page);
  }

  canvas.dragging { cursor: grabbing; }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-primary);
    max-width: 280px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }

  #tooltip .kind {
    color: var(--text-muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 2px;
  }

  #panel {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 18px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 160ms ease;
    z-index: 5;
  }

  #panel.open { transform: translateX(0); }

  #panel-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }

  #panel-close:hover { color: var(--text-primary); }

  .panel-kind {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 12px;
  }

  .panel-kind.fact { background: rgba(138, 138, 134, 0.25); color: var(--fact); }
  .panel-kind.lesson { background: rgba(95, 168, 61, 0.2); color: var(--lesson); }
  .panel-kind.task { background: rgba(57, 135, 229, 0.2); color: var(--task); }

  #panel-content h2 {
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 14px;
    color: var(--text-primary);
  }

  #panel-content .field {
    margin-bottom: 14px;
  }

  #panel-content .field-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  #panel-content .field-value {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .tag-chip {
    display: inline-block;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    margin: 0 4px 4px 0;
  }

  #empty-state {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 24px;
    pointer-events: none;
    z-index: 3;
  }

  #empty-state code {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    color: var(--text-secondary);
    pointer-events: auto;
    user-select: all;
  }

  #hint {
    position: absolute;
    left: 18px;
    bottom: 14px;
    font-size: 11px;
    color: var(--text-muted);
    z-index: 3;
    pointer-events: none;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Secone Brain <span>&mdash; Memory Graph</span></h1>
    <input id="search" type="text" placeholder="Search facts, lessons, tasks&hellip;" />
    <div class="legend">
      <button class="legend-item" data-kind="fact"><span class="dot fact"></span>Fact</button>
      <button class="legend-item" data-kind="lesson"><span class="dot lesson"></span>Lesson</button>
      <button class="legend-item" data-kind="task"><span class="dot task"></span>Task</button>
    </div>
    <div id="stats"></div>
  </header>
  <main>
    <canvas id="scene"></canvas>
    <div id="tooltip" class="hidden"></div>
    <aside id="panel">
      <button id="panel-close">&times;</button>
      <div id="panel-content"></div>
    </aside>
    <div id="empty-state" class="hidden">
      <div>No memories yet.</div>
      <div>Chat with the brain or run a task, then reload this page &mdash;<br />
        or seed one now: <code>curl -X POST /memory -d '{"kind":"fact","content":"hello","tags":["demo"]}' -H 'content-type: application/json'</code>
      </div>
    </div>
    <div id="hint">Drag to rotate &middot; scroll to zoom &middot; click a memory for details</div>
  </main>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const tooltip = document.getElementById("tooltip");
  const panel = document.getElementById("panel");
  const panelContent = document.getElementById("panel-content");
  const statsEl = document.getElementById("stats");
  const searchEl = document.getElementById("search");
  const emptyState = document.getElementById("empty-state");

  const COLORS = { fact: "#8a8a86", lesson: "#5fa83d", task: "#3987e5" };
  // Cycled per connected component ("branch") to color same-branch facts
  // alike - distinct from the lesson/task hues above so kind and branch
  // never look like the same signal.
  const BRANCH_COLORS = ["#d95926", "#199e70", "#c98500", "#d55181", "#9085e9", "#e66767"];
  const hiddenKinds = new Set();

  function colorFor(node) {
    if (node.kind === "fact" && node.branch != null) {
      return BRANCH_COLORS[node.branch % BRANCH_COLORS.length];
    }
    return COLORS[node.kind] || COLORS.fact;
  }

  // --- scene constants ---
  const GLOBE_RADIUS = 120;
  const ORBIT_MIN = 175;
  const ORBIT_JITTER = 55;
  const CLUSTER_SPREAD = 0.32; // radians - how tightly a branch clusters around its direction
  const CAMERA_DISTANCE = 900;

  let width = 0, height = 0, dpr = 1;
  let nodes = [];
  let edges = [];
  let byId = new Map();
  let selectedId = null;
  let hoveredId = null;
  let searchQuery = "";
  let lastProjected = []; // refreshed every frame, used for hit-testing

  const rotation = { yaw: 0.4, pitch: -0.25 };
  let zoom = 1;
  let autoRotate = true;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // --- deterministic per-node randomness (stable layout across reloads) ---
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function radiusFor(node) {
    const base = node.kind === "task" ? 6 : 7;
    return Math.min(20, base + Math.sqrt(node.degree || 0) * 2.5);
  }

  // Evenly spaced direction on the unit sphere (golden-angle spiral) -
  // used both for whole branches and for lone/unclustered nodes.
  function fibonacciDirection(i, total) {
    const y = total > 1 ? 1 - (i / (total - 1)) * 2 : 0;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = Math.PI * (3 - Math.sqrt(5)) * i;
    return { x: Math.cos(theta) * r, y, z: Math.sin(theta) * r };
  }

  // --- lay memories out around the globe: same branch -> same neighborhood ---
  function assignPositions(allNodes) {
    const byBranch = new Map();
    const loose = [];
    for (const n of allNodes) {
      if (n.branch != null) {
        if (!byBranch.has(n.branch)) byBranch.set(n.branch, []);
        byBranch.get(n.branch).push(n);
      } else {
        loose.push(n);
      }
    }

    const branchIds = Array.from(byBranch.keys());
    const totalDirections = Math.max(1, branchIds.length + loose.length);
    let dirIndex = 0;

    for (const branchId of branchIds) {
      const dir = fibonacciDirection(dirIndex++, totalDirections);
      for (const n of byBranch.get(branchId)) {
        const rng = mulberry32(hashStr(n.id));
        const jx = dir.x + (rng() - 0.5) * 2 * CLUSTER_SPREAD;
        const jy = dir.y + (rng() - 0.5) * 2 * CLUSTER_SPREAD;
        const jz = dir.z + (rng() - 0.5) * 2 * CLUSTER_SPREAD;
        const len = Math.hypot(jx, jy, jz) || 1;
        const orbit = ORBIT_MIN + rng() * ORBIT_JITTER;
        n.x3 = (jx / len) * orbit;
        n.y3 = (jy / len) * orbit;
        n.z3 = (jz / len) * orbit;
      }
    }
    for (const n of loose) {
      const dir = fibonacciDirection(dirIndex++, totalDirections);
      const rng = mulberry32(hashStr(n.id));
      const orbit = ORBIT_MIN + rng() * ORBIT_JITTER;
      n.x3 = dir.x * orbit;
      n.y3 = dir.y * orbit;
      n.z3 = dir.z * orbit;
    }
  }

  // --- 3D math: rotate around Y (yaw) then X (pitch), then perspective-project ---
  function rotatePoint(p) {
    const cy = Math.cos(rotation.yaw), sy = Math.sin(rotation.yaw);
    let x = p.x * cy + p.z * sy;
    let z = -p.x * sy + p.z * cy;
    const cx = Math.cos(rotation.pitch), sx = Math.sin(rotation.pitch);
    let y = p.y * cx - z * sx;
    z = p.y * sx + z * cx;
    return { x, y, z };
  }

  function projectRotated(rp) {
    const scale = (CAMERA_DISTANCE / (CAMERA_DISTANCE + rp.z)) * zoom;
    return {
      x: width / 2 + rp.x * scale,
      y: height / 2 + rp.y * scale,
      scale,
      depth: rp.z,
      behindGlobe: rp.z > 0 && Math.hypot(rp.x, rp.y) < GLOBE_RADIUS,
    };
  }

  function project(p3) {
    return projectRotated(rotatePoint(p3));
  }

  // --- globe rendering ---
  function drawGlobe() {
    const r = GLOBE_RADIUS * zoom;
    const cx = width / 2, cy = height / 2;

    ctx.save();
    ctx.shadowColor = "rgba(59, 130, 246, 0.55)";
    ctx.shadowBlur = 46;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2);
    ctx.fillStyle = "#1c4f8f";
    ctx.fill();
    ctx.restore();

    const grad = ctx.createRadialGradient(
      cx - r * 0.35, cy - r * 0.35, r * 0.08,
      cx, cy, r
    );
    grad.addColorStop(0, "#7cb8ee");
    grad.addColorStop(0.45, "#2f74c4");
    grad.addColorStop(1, "#0a2c50");
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    drawGraticule(r / GLOBE_RADIUS);
  }

  function drawGraticule(scale) {
    ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
    ctx.lineWidth = 1;
    const steps = 48;

    const longitudes = [0, Math.PI / 3, (2 * Math.PI) / 3];
    for (const phi0 of longitudes) {
      const path = [];
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const p3 = {
          x: GLOBE_RADIUS * Math.sin(theta) * Math.cos(phi0),
          y: GLOBE_RADIUS * Math.cos(theta),
          z: GLOBE_RADIUS * Math.sin(theta) * Math.sin(phi0),
        };
        const rp = rotatePoint(p3);
        const pr = projectRotated(rp);
        path.push({ visible: rp.z <= 0, x: pr.x, y: pr.y });
      }
      strokePath(path);
    }

    const latitudes = [Math.PI / 4, Math.PI / 2, (3 * Math.PI) / 4];
    for (const theta0 of latitudes) {
      const path = [];
      for (let i = 0; i <= steps; i++) {
        const phi = (i / steps) * Math.PI * 2;
        const p3 = {
          x: GLOBE_RADIUS * Math.sin(theta0) * Math.cos(phi),
          y: GLOBE_RADIUS * Math.cos(theta0),
          z: GLOBE_RADIUS * Math.sin(theta0) * Math.sin(phi),
        };
        const rp = rotatePoint(p3);
        const pr = projectRotated(rp);
        path.push({ visible: rp.z <= 0, x: pr.x, y: pr.y });
      }
      strokePath(path);
    }
  }

  function strokePath(path) {
    ctx.beginPath();
    let started = false;
    for (const pt of path) {
      if (!pt.visible) { started = false; continue; }
      if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
  }

  // --- node/edge rendering ---
  function haystackOf(n) {
    return (n.label + " " + n.detail + " " + n.tags.join(" ")).toLowerCase();
  }

  function drawEdge(a, b, kind) {
    const pa = project({ x: a.x3, y: a.y3, z: a.z3 });
    const pb = project({ x: b.x3, y: b.y3, z: b.z3 });
    let alpha = kind === "produced" ? 0.5 : 0.18;
    if (pa.behindGlobe || pb.behindGlobe) alpha *= 0.25;
    if (hiddenKinds.has(a.kind) || hiddenKinds.has(b.kind)) return;
    ctx.strokeStyle = kind === "produced"
      ? `rgba(89, 165, 89, ${alpha})`
      : `rgba(195, 194, 183, ${alpha})`;
    ctx.lineWidth = kind === "produced" ? 1.4 : 1;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
  }

  function drawNode(n, p) {
    const r = radiusFor(n) * p.scale;
    const isHovered = n.id === hoveredId;
    const isSelected = n.id === selectedId;
    const isMatch = searchQuery && haystackOf(n).includes(searchQuery);
    const isDim = searchQuery && !isMatch;

    let alpha = 1;
    if (p.behindGlobe) alpha *= 0.16;
    if (isDim) alpha *= 0.12;

    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(1.5, r), 0, Math.PI * 2);
    ctx.fillStyle = colorFor(n);
    ctx.fill();

    if (isSelected || (isMatch && !p.behindGlobe)) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = isSelected ? "#ffffff" : "#ffd23f";
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if ((isHovered || isSelected || isMatch) && !p.behindGlobe) {
      const label = n.label.length > 40 ? n.label.slice(0, 39) + "…" : n.label;
      ctx.font = "11px system-ui, -apple-system, sans-serif";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(13, 13, 13, 0.9)";
      ctx.fillStyle = "#c3c2b7";
      ctx.textBaseline = "middle";
      const tx = p.x + r + 6;
      ctx.strokeText(label, tx, p.y);
      ctx.fillText(label, tx, p.y);
    }
  }

  function render() {
    ctx.clearRect(0, 0, width, height);
    drawGlobe();

    const visibleEdges = edges.filter(
      (e) => !hiddenKinds.has(e.a.kind) && !hiddenKinds.has(e.b.kind)
    );
    const visibleNodes = nodes.filter((n) => !hiddenKinds.has(n.kind));

    const projectedNodes = visibleNodes.map((n) => ({ n, p: project({ x: n.x3, y: n.y3, z: n.z3 }) }));

    const drawables = [];
    for (const e of visibleEdges) {
      const da = rotatePoint({ x: e.a.x3, y: e.a.y3, z: e.a.z3 }).z;
      const db = rotatePoint({ x: e.b.x3, y: e.b.y3, z: e.b.z3 }).z;
      drawables.push({ type: "edge", depth: (da + db) / 2, e });
    }
    for (const pn of projectedNodes) {
      drawables.push({ type: "node", depth: pn.p.depth, pn });
    }
    drawables.sort((a, b) => b.depth - a.depth); // far first (painter's algorithm)

    for (const d of drawables) {
      if (d.type === "edge") drawEdge(d.e.a, d.e.b, d.e.kind);
      else drawNode(d.pn.n, d.pn.p);
    }

    lastProjected = projectedNodes;
  }

  function loop() {
    if (autoRotate) rotation.yaw += 0.0016;
    render();
    requestAnimationFrame(loop);
  }

  // --- drag to rotate / wheel to zoom (hand-rolled, no 3D library) ---
  let dragState = null;
  canvas.addEventListener("pointerdown", (event) => {
    dragState = { x: event.clientX, y: event.clientY, moved: false };
    autoRotate = false;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", (event) => {
    if (dragState) {
      const dx = event.clientX - dragState.x;
      const dy = event.clientY - dragState.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragState.moved = true;
      rotation.yaw += dx * 0.006;
      rotation.pitch = Math.max(-1.45, Math.min(1.45, rotation.pitch + dy * 0.006));
      dragState.x = event.clientX;
      dragState.y = event.clientY;
      return;
    }
    handleHover(event);
  });
  canvas.addEventListener("pointerup", (event) => {
    canvas.classList.remove("dragging");
    if (dragState && !dragState.moved) {
      handleClick(event);
    }
    dragState = null;
  });
  canvas.addEventListener("wheel", (event) => {
    event.preventDefault();
    zoom = Math.max(0.5, Math.min(2.5, zoom * Math.exp(-event.deltaY * 0.001)));
  }, { passive: false });

  function nearestNodeAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left, my = clientY - rect.top;
    let best = null, bestDist = Infinity;
    for (const { n, p } of lastProjected) {
      if (p.behindGlobe) continue;
      const r = Math.max(6, radiusFor(n) * p.scale);
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d <= r && d < bestDist) {
        best = n;
        bestDist = d;
      }
    }
    return best;
  }

  function handleHover(event) {
    const n = nearestNodeAt(event.clientX, event.clientY);
    hoveredId = n ? n.id : null;
    if (n) {
      const rect = canvas.getBoundingClientRect();
      tooltip.classList.remove("hidden");
      tooltip.innerHTML = `<span class="kind">${n.kind}</span>${escapeHtml(n.label)}`;
      tooltip.style.left = event.clientX - rect.left + 14 + "px";
      tooltip.style.top = event.clientY - rect.top + 14 + "px";
      canvas.style.cursor = "pointer";
    } else {
      tooltip.classList.add("hidden");
      canvas.style.cursor = "grab";
    }
  }

  function handleClick(event) {
    const n = nearestNodeAt(event.clientX, event.clientY);
    if (n) openPanel(n);
  }

  // --- selection / panel ---
  function openPanel(node) {
    selectedId = node.id;
    const tagsHtml = node.tags.length
      ? node.tags.map((t) => `<span class="tag-chip">${escapeHtml(t)}</span>`).join("")
      : '<span class="field-value">&mdash;</span>';
    panelContent.innerHTML = `
      <span class="panel-kind ${node.kind}">${node.kind}</span>
      <h2>${escapeHtml(node.label)}</h2>
      <div class="field">
        <div class="field-label">Full content</div>
        <div class="field-value">${escapeHtml(node.detail)}</div>
      </div>
      <div class="field">
        <div class="field-label">Tags</div>
        <div class="field-value">${tagsHtml}</div>
      </div>
      <div class="field">
        <div class="field-label">Source</div>
        <div class="field-value">${escapeHtml(node.source)}</div>
      </div>
      <div class="field">
        <div class="field-label">Created</div>
        <div class="field-value">${escapeHtml(node.created_at)}</div>
      </div>
      <div class="field">
        <div class="field-label">Connections</div>
        <div class="field-value">${node.degree}</div>
      </div>
    `;
    panel.classList.add("open");
  }

  document.getElementById("panel-close").addEventListener("click", () => {
    panel.classList.remove("open");
    selectedId = null;
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  // --- search ---
  searchEl.addEventListener("input", () => {
    searchQuery = searchEl.value.trim().toLowerCase();
  });

  // --- legend toggles ---
  document.querySelectorAll(".legend-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      const kind = btn.dataset.kind;
      if (hiddenKinds.has(kind)) {
        hiddenKinds.delete(kind);
        btn.classList.remove("off");
      } else {
        hiddenKinds.add(kind);
        btn.classList.add("off");
      }
    });
  });

  // --- build ---
  function buildGraph(data) {
    nodes = data.nodes.map((n) => ({ ...n }));
    byId = new Map(nodes.map((n) => [n.id, n]));
    edges = data.edges
      .map((e) => ({ ...e, a: byId.get(e.source), b: byId.get(e.target) }))
      .filter((e) => e.a && e.b);

    assignPositions(nodes);

    statsEl.textContent = `${nodes.length} memories · ${edges.length} connections`;
    emptyState.classList.toggle("hidden", nodes.length > 0);

    requestAnimationFrame(loop);
  }

  fetch("/graph/data")
    .then((r) => r.json())
    .then(buildGraph)
    .catch((err) => {
      emptyState.classList.remove("hidden");
      emptyState.innerHTML = `<div>Couldn't load the graph: ${escapeHtml(err.message)}</div>`;
      requestAnimationFrame(loop); // still render the empty globe
    });
})();
</script>
</body>
</html>
