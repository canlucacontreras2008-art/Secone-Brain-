<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Secone Brain — Memory Graph</title>
<style>
  :root {
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255, 255, 255, 0.10);
    --fact: #8a8a86;
    --lesson: #5fa83d;
    --task: #3987e5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
    z-index: 2;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    color: var(--text-primary);
  }

  header h1 span {
    color: var(--text-muted);
    font-weight: 400;
  }

  #search {
    flex: 1 1 220px;
    min-width: 160px;
    max-width: 360px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    padding: 6px 10px;
    font-size: 13px;
  }

  #search::placeholder { color: var(--text-muted); }
  #search:focus { outline: none; border-color: var(--text-secondary); }

  .legend {
    display: flex;
    gap: 6px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-secondary);
    font-size: 12px;
    padding: 5px 10px 5px 8px;
    cursor: pointer;
  }

  .legend-item.off { opacity: 0.35; }
  .legend-item:hover { border-color: var(--text-secondary); }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    flex: none;
  }

  .dot.fact { background: var(--fact); }
  .dot.lesson { background: var(--lesson); }
  .dot.task { background: var(--task); }

  #stats {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  main {
    position: relative;
    flex: 1;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    background: var(--page);
  }

  canvas.dragging { cursor: grabbing; }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-primary);
    max-width: 280px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }

  #tooltip .kind {
    color: var(--text-muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 2px;
  }

  #panel {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 18px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 160ms ease;
    z-index: 5;
  }

  #panel.open { transform: translateX(0); }

  #panel-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }

  #panel-close:hover { color: var(--text-primary); }

  .panel-kind {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 12px;
  }

  .panel-kind.fact { background: rgba(138, 138, 134, 0.25); color: var(--fact); }
  .panel-kind.lesson { background: rgba(95, 168, 61, 0.2); color: var(--lesson); }
  .panel-kind.task { background: rgba(57, 135, 229, 0.2); color: var(--task); }

  #panel-content h2 {
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 14px;
    color: var(--text-primary);
  }

  #panel-content .field {
    margin-bottom: 14px;
  }

  #panel-content .field-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  #panel-content .field-value {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .tag-chip {
    display: inline-block;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    margin: 0 4px 4px 0;
  }

  #empty-state {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 24px;
    pointer-events: none;
    z-index: 3;
  }

  #empty-state code {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    color: var(--text-secondary);
    pointer-events: auto;
    user-select: all;
  }

  #hint {
    position: absolute;
    left: 18px;
    bottom: 14px;
    font-size: 11px;
    color: var(--text-muted);
    z-index: 3;
    pointer-events: none;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Secone Brain <span>&mdash; Memory Graph</span></h1>
    <input id="search" type="text" placeholder="Search facts, lessons, tasks&hellip;" />
    <div class="legend">
      <button class="legend-item" data-kind="fact"><span class="dot fact"></span>Fact</button>
      <button class="legend-item" data-kind="lesson"><span class="dot lesson"></span>Lesson</button>
      <button class="legend-item" data-kind="task"><span class="dot task"></span>Task</button>
    </div>
    <div id="stats"></div>
  </header>
  <main>
    <canvas id="scene"></canvas>
    <div id="tooltip" class="hidden"></div>
    <aside id="panel">
      <button id="panel-close">&times;</button>
      <div id="panel-content"></div>
    </aside>
    <div id="empty-state" class="hidden">
      <div>No memories yet.</div>
      <div>Chat with the brain or run a task, then reload this page &mdash;<br />
        or seed one now: <code>curl -X POST /memory -d '{"kind":"fact","content":"hello","tags":["demo"]}' -H 'content-type: application/json'</code>
      </div>
    </div>
    <div id="hint">Drag to rotate &middot; scroll to zoom &middot; click a memory for details</div>
  </main>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const tooltip = document.getElementById("tooltip");
  const panel = document.getElementById("panel");
  const panelContent = document.getElementById("panel-content");
  const statsEl = document.getElementById("stats");
  const searchEl = document.getElementById("search");
  const emptyState = document.getElementById("empty-state");

  const COLORS = { fact: "#8a8a86", lesson: "#5fa83d", task: "#3987e5" };
  // Cycled per connected component ("branch") to color same-branch facts
  // alike - distinct from the lesson/task hues above so kind and branch
  // never look like the same signal.
  const BRANCH_COLORS = ["#d95926", "#199e70", "#c98500", "#d55181", "#9085e9", "#e66767"];
  const hiddenKinds = new Set();

  function colorFor(node) {
    if (node.kind === "fact" && node.branch != null) {
      return BRANCH_COLORS[node.branch % BRANCH_COLORS.length];
    }
    return COLORS[node.kind] || COLORS.fact;
  }

  // --- scene constants ---
  const GLOBE_RADIUS = 120;
  const ORBIT_MIN = 175;
  const ORBIT_JITTER = 55;
  const CAMERA_DISTANCE = 900;

  let width = 0, height = 0, dpr = 1;
  let nodes = [];
  let edges = [];
  let byId = new Map();
  let selectedId = null;
  let hoveredId = null;
  let searchQuery = "";
  let lastProjected = []; // refreshed every frame, used for hit-testing

  const rotation = { yaw: 0.4, pitch: -0.25 };
  let zoom = 1;
  let autoRotate = true;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // --- deterministic per-node randomness (stable layout across reloads) ---
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function radiusFor(node) {
    const base = node.kind === "task" ? 3.5 : 4;
    return Math.min(12, base + Math.sqrt(node.degree || 0) * 1.5);
  }

  // Regular latitude/longitude grid of directions on the unit sphere -
  // excludes the poles themselves (a full row would collapse to one point).
  function sphereGrid(rows, cols) {
    const slots = [];
    for (let i = 0; i < rows; i++) {
      const theta = ((i + 1) / (rows + 1)) * Math.PI;
      for (let j = 0; j < cols; j++) {
        const phi = (j / cols) * Math.PI * 2;
        slots.push({
          x: Math.sin(theta) * Math.cos(phi),
          y: Math.cos(theta),
          z: Math.sin(theta) * Math.sin(phi),
        });
      }
    }
    return slots;
  }

  // --- lay memories out in a grid around the globe: same branch -> adjacent cells ---
  function assignPositions(allNodes) {
    const byBranch = new Map();
    const loose = [];
    for (const n of allNodes) {
      if (n.branch != null) {
        if (!byBranch.has(n.branch)) byBranch.set(n.branch, []);
        byBranch.get(n.branch).push(n);
      } else {
        loose.push(n);
      }
    }
    const ordered = [];
    for (const members of byBranch.values()) ordered.push(...members);
    ordered.push(...loose);

    const count = Math.max(1, ordered.length);
    const cols = Math.max(6, Math.ceil(Math.sqrt(count * 2)));
    const rows = Math.max(3, Math.ceil(count / cols));
    const slots = sphereGrid(rows, cols);

    ordered.forEach((node, i) => {
      const dir = slots[i % slots.length];
      const rng = mulberry32(hashStr(node.id));
      const orbit = ORBIT_MIN + rng() * ORBIT_JITTER;
      node.x3 = dir.x * orbit;
      node.y3 = dir.y * orbit;
      node.z3 = dir.z * orbit;
    });
  }

  // --- 3D math: rotate around Y (yaw) then X (pitch), then perspective-project ---
  function rotatePoint(p) {
    const cy = Math.cos(rotation.yaw), sy = Math.sin(rotation.yaw);
    let x = p.x * cy + p.z * sy;
    let z = -p.x * sy + p.z * cy;
    const cx = Math.cos(rotation.pitch), sx = Math.sin(rotation.pitch);
    let y = p.y * cx - z * sx;
    z = p.y * sx + z * cx;
    return { x, y, z };
  }

  function projectRotated(rp) {
    const scale = (CAMERA_DISTANCE / (CAMERA_DISTANCE + rp.z)) * zoom;
    return {
      x: width / 2 + rp.x * scale,
      y: height / 2 + rp.y * scale,
      scale,
      depth: rp.z,
      behindGlobe: rp.z > 0 && Math.hypot(rp.x, rp.y) < GLOBE_RADIUS,
    };
  }

  function project(p3) {
    return projectRotated(rotatePoint(p3));
  }

  // --- small 3D vector helpers, for tracing arcs across the sphere surface ---
  function vNormalize(v) {
    const len = Math.hypot(v.x, v.y, v.z) || 1;
    return { x: v.x / len, y: v.y / len, z: v.z / len };
  }
  function vCross(a, b) {
    return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
  }
  function vDot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
  function vRotateAroundAxis(v, axis, angle) {
    // Rodrigues' rotation formula
    const c = Math.cos(angle), s = Math.sin(angle);
    const cr = vCross(axis, v);
    const d = vDot(axis, v);
    return {
      x: v.x * c + cr.x * s + axis.x * d * (1 - c),
      y: v.y * c + cr.y * s + axis.y * d * (1 - c),
      z: v.z * c + cr.z * s + axis.z * d * (1 - c),
    };
  }
  function randomUnitVector(rng) {
    const z = 1 - 2 * rng();
    const r = Math.sqrt(Math.max(0, 1 - z * z));
    const phi = rng() * Math.PI * 2;
    return { x: r * Math.cos(phi), y: r * Math.sin(phi), z };
  }
  function randomTangent(rng, p) {
    const v = randomUnitVector(rng);
    const d = vDot(v, p);
    return vNormalize({ x: v.x - d * p.x, y: v.y - d * p.y, z: v.z - d * p.z });
  }

  // --- globe rendering: a dense golden holographic core, not a flat map ---
  function drawGlobe() {
    const r = GLOBE_RADIUS * zoom;
    const cx = width / 2, cy = height / 2;

    ctx.save();
    ctx.shadowColor = "rgba(255, 178, 60, 0.7)";
    ctx.shadowBlur = 70;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.88, 0, Math.PI * 2);
    ctx.fillStyle = "#8a4c0f";
    ctx.fill();
    ctx.restore();

    const grad = ctx.createRadialGradient(
      cx - r * 0.3, cy - r * 0.3, r * 0.04,
      cx, cy, r
    );
    grad.addColorStop(0, "rgba(255, 246, 220, 0.92)");
    grad.addColorStop(0.35, "rgba(250, 182, 76, 0.55)");
    grad.addColorStop(0.7, "rgba(197, 105, 22, 0.32)");
    grad.addColorStop(1, "rgba(60, 30, 8, 0.14)");
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    drawFrameRings();
    drawGraticule();
    drawCircuitTraces();
    drawSparklePoints();
  }

  function sphereProject(p3) {
    const rp = rotatePoint(p3);
    const pr = projectRotated(rp);
    return { visible: rp.z <= 0, x: pr.x, y: pr.y };
  }

  function drawGraticule() {
    const steps = 56;
    const longitudeCount = 11;
    const latitudeCount = 7;

    ctx.lineWidth = 1;
    for (let i = 0; i < longitudeCount; i++) {
      const phi0 = (i / longitudeCount) * Math.PI;
      const path = [];
      for (let s = 0; s <= steps; s++) {
        const theta = (s / steps) * Math.PI * 2;
        path.push(sphereProject({
          x: GLOBE_RADIUS * Math.sin(theta) * Math.cos(phi0),
          y: GLOBE_RADIUS * Math.cos(theta),
          z: GLOBE_RADIUS * Math.sin(theta) * Math.sin(phi0),
        }));
      }
      ctx.strokeStyle = "rgba(255, 200, 120, 0.22)";
      strokePath(path);
    }

    for (let i = 1; i <= latitudeCount; i++) {
      const theta0 = (i / (latitudeCount + 1)) * Math.PI;
      const path = [];
      for (let s = 0; s <= steps; s++) {
        const phi = (s / steps) * Math.PI * 2;
        path.push(sphereProject({
          x: GLOBE_RADIUS * Math.sin(theta0) * Math.cos(phi),
          y: GLOBE_RADIUS * Math.cos(theta0),
          z: GLOBE_RADIUS * Math.sin(theta0) * Math.sin(phi),
        }));
      }
      ctx.strokeStyle = "rgba(255, 200, 120, 0.16)";
      strokePath(path);
    }
  }

  // Short glowing arcs scattered over the surface, like circuit traces -
  // fixed seed so the texture is stable across reloads, not regenerated
  // (and re-randomized) on every render.
  const circuitRng = mulberry32(913_311);
  const CIRCUIT_TRACES = Array.from({ length: 70 }, () => {
    const p0 = randomUnitVector(circuitRng);
    const tangent = randomTangent(circuitRng, p0);
    const axis = vNormalize(vCross(p0, tangent));
    const arcLen = 0.14 + circuitRng() * 0.34;
    const width = 0.8 + circuitRng() * 1.4;
    const brightness = 0.22 + circuitRng() * 0.5;
    const g = 170 + Math.floor(circuitRng() * 60);
    const b = 50 + Math.floor(circuitRng() * 70);
    return { p0, axis, arcLen, width, color: `rgba(255, ${g}, ${b}, ${brightness})` };
  });

  function drawCircuitTraces() {
    const steps = 8;
    for (const trace of CIRCUIT_TRACES) {
      const path = [];
      for (let s = 0; s <= steps; s++) {
        const angle = (s / steps) * trace.arcLen;
        const p = vRotateAroundAxis(trace.p0, trace.axis, angle);
        path.push(sphereProject({ x: p.x * GLOBE_RADIUS, y: p.y * GLOBE_RADIUS, z: p.z * GLOBE_RADIUS }));
      }
      ctx.strokeStyle = trace.color;
      ctx.lineWidth = trace.width;
      strokePath(path);
    }
  }

  // A handful of bright points that twinkle - fixed positions (seeded),
  // animated brightness only, tied to wall-clock time.
  const sparkleRng = mulberry32(42_042);
  const SPARKLE_POINTS = Array.from({ length: 36 }, () => ({
    p: randomUnitVector(sparkleRng),
    phase: sparkleRng() * Math.PI * 2,
  }));

  function drawSparklePoints() {
    const t = performance.now() * 0.0015;
    for (const sp of SPARKLE_POINTS) {
      const p3 = { x: sp.p.x * GLOBE_RADIUS, y: sp.p.y * GLOBE_RADIUS, z: sp.p.z * GLOBE_RADIUS };
      const rp = rotatePoint(p3);
      if (rp.z > 0) continue;
      const pr = projectRotated(rp);
      const twinkle = 0.35 + 0.55 * Math.abs(Math.sin(t + sp.phase));
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, Math.max(1, 1.6 * pr.scale), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 235, 195, ${twinkle})`;
      ctx.fill();
    }
  }

  // A couple of large tilted rings around the globe - decorative structure,
  // evoking an armillary-sphere / hologram-rig frame rather than a plain ball.
  const FRAME_RINGS = [
    { tiltX: 1.0, tiltY: 0.35, radiusMul: 1.28 },
    { tiltX: -0.55, tiltY: 1.15, radiusMul: 1.2 },
  ];

  function drawFrameRings() {
    const steps = 72;
    for (const ring of FRAME_RINGS) {
      const R = GLOBE_RADIUS * ring.radiusMul;
      const path = [];
      for (let s = 0; s <= steps; s++) {
        const t = (s / steps) * Math.PI * 2;
        let p3 = { x: R * Math.cos(t), y: 0, z: R * Math.sin(t) };
        // fixed tilt defines the ring's own plane, then the live scene
        // rotation (in rotatePoint, via sphereProject) spins it with the globe
        const cy = Math.cos(ring.tiltY), sy = Math.sin(ring.tiltY);
        p3 = { x: p3.x * cy + p3.z * sy, y: p3.y, z: -p3.x * sy + p3.z * cy };
        const cx2 = Math.cos(ring.tiltX), sx2 = Math.sin(ring.tiltX);
        p3 = { x: p3.x, y: p3.y * cx2 - p3.z * sx2, z: p3.y * sx2 + p3.z * cx2 };
        const pr = projectRotated(rotatePoint(p3));
        path.push({ visible: true, x: pr.x, y: pr.y });
      }
      ctx.strokeStyle = "rgba(255, 205, 130, 0.3)";
      ctx.lineWidth = 1.2;
      strokePath(path);
    }
  }

  function strokePath(path) {
    ctx.beginPath();
    let started = false;
    for (const pt of path) {
      if (!pt.visible) { started = false; continue; }
      if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
  }

  // --- node/edge rendering ---
  function haystackOf(n) {
    return (n.label + " " + n.detail + " " + n.tags.join(" ")).toLowerCase();
  }

  function drawEdge(a, b, kind) {
    const pa = project({ x: a.x3, y: a.y3, z: a.z3 });
    const pb = project({ x: b.x3, y: b.y3, z: b.z3 });
    let alpha = kind === "produced" ? 0.5 : 0.18;
    if (pa.behindGlobe || pb.behindGlobe) alpha *= 0.25;
    if (hiddenKinds.has(a.kind) || hiddenKinds.has(b.kind)) return;
    ctx.strokeStyle = kind === "produced"
      ? `rgba(89, 165, 89, ${alpha})`
      : `rgba(195, 194, 183, ${alpha})`;
    ctx.lineWidth = kind === "produced" ? 1.4 : 1;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
  }

  function drawNode(n, p) {
    const r = radiusFor(n) * p.scale;
    const isHovered = n.id === hoveredId;
    const isSelected = n.id === selectedId;
    const isMatch = searchQuery && haystackOf(n).includes(searchQuery);
    const isDim = searchQuery && !isMatch;

    let alpha = 1;
    if (p.behindGlobe) alpha *= 0.16;
    if (isDim) alpha *= 0.12;

    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(1.5, r), 0, Math.PI * 2);
    ctx.fillStyle = colorFor(n);
    ctx.fill();

    if (isSelected || (isMatch && !p.behindGlobe)) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = isSelected ? "#ffffff" : "#ffd23f";
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if ((isHovered || isSelected || isMatch) && !p.behindGlobe) {
      const label = n.label.length > 40 ? n.label.slice(0, 39) + "…" : n.label;
      ctx.font = "11px system-ui, -apple-system, sans-serif";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(13, 13, 13, 0.9)";
      ctx.fillStyle = "#c3c2b7";
      ctx.textBaseline = "middle";
      const tx = p.x + r + 6;
      ctx.strokeText(label, tx, p.y);
      ctx.fillText(label, tx, p.y);
    }
  }

  function render() {
    ctx.clearRect(0, 0, width, height);
    drawGlobe();

    const visibleEdges = edges.filter(
      (e) => !hiddenKinds.has(e.a.kind) && !hiddenKinds.has(e.b.kind)
    );
    const visibleNodes = nodes.filter((n) => !hiddenKinds.has(n.kind));

    const projectedNodes = visibleNodes.map((n) => ({ n, p: project({ x: n.x3, y: n.y3, z: n.z3 }) }));

    const drawables = [];
    for (const e of visibleEdges) {
      const da = rotatePoint({ x: e.a.x3, y: e.a.y3, z: e.a.z3 }).z;
      const db = rotatePoint({ x: e.b.x3, y: e.b.y3, z: e.b.z3 }).z;
      drawables.push({ type: "edge", depth: (da + db) / 2, e });
    }
    for (const pn of projectedNodes) {
      drawables.push({ type: "node", depth: pn.p.depth, pn });
    }
    drawables.sort((a, b) => b.depth - a.depth); // far first (painter's algorithm)

    for (const d of drawables) {
      if (d.type === "edge") drawEdge(d.e.a, d.e.b, d.e.kind);
      else drawNode(d.pn.n, d.pn.p);
    }

    lastProjected = projectedNodes;
  }

  function loop() {
    if (autoRotate) rotation.yaw += 0.0016;
    render();
    requestAnimationFrame(loop);
  }

  // --- drag to rotate / wheel to zoom (hand-rolled, no 3D library) ---
  let dragState = null;
  canvas.addEventListener("pointerdown", (event) => {
    dragState = { x: event.clientX, y: event.clientY, moved: false };
    autoRotate = false;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", (event) => {
    if (dragState) {
      const dx = event.clientX - dragState.x;
      const dy = event.clientY - dragState.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragState.moved = true;
      rotation.yaw += dx * 0.006;
      rotation.pitch = Math.max(-1.45, Math.min(1.45, rotation.pitch + dy * 0.006));
      dragState.x = event.clientX;
      dragState.y = event.clientY;
      return;
    }
    handleHover(event);
  });
  canvas.addEventListener("pointerup", (event) => {
    canvas.classList.remove("dragging");
    if (dragState && !dragState.moved) {
      handleClick(event);
    }
    dragState = null;
  });
  canvas.addEventListener("wheel", (event) => {
    event.preventDefault();
    zoom = Math.max(0.5, Math.min(2.5, zoom * Math.exp(-event.deltaY * 0.001)));
  }, { passive: false });

  function nearestNodeAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left, my = clientY - rect.top;
    let best = null, bestDist = Infinity;
    for (const { n, p } of lastProjected) {
      if (p.behindGlobe) continue;
      const r = Math.max(6, radiusFor(n) * p.scale);
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d <= r && d < bestDist) {
        best = n;
        bestDist = d;
      }
    }
    return best;
  }

  function handleHover(event) {
    const n = nearestNodeAt(event.clientX, event.clientY);
    hoveredId = n ? n.id : null;
    if (n) {
      const rect = canvas.getBoundingClientRect();
      tooltip.classList.remove("hidden");
      tooltip.innerHTML = `<span class="kind">${n.kind}</span>${escapeHtml(n.label)}`;
      tooltip.style.left = event.clientX - rect.left + 14 + "px";
      tooltip.style.top = event.clientY - rect.top + 14 + "px";
      canvas.style.cursor = "pointer";
    } else {
      tooltip.classList.add("hidden");
      canvas.style.cursor = "grab";
    }
  }

  function handleClick(event) {
    const n = nearestNodeAt(event.clientX, event.clientY);
    if (n) openPanel(n);
  }

  // --- selection / panel ---
  function openPanel(node) {
    selectedId = node.id;
    const tagsHtml = node.tags.length
      ? node.tags.map((t) => `<span class="tag-chip">${escapeHtml(t)}</span>`).join("")
      : '<span class="field-value">&mdash;</span>';
    panelContent.innerHTML = `
      <span class="panel-kind ${node.kind}">${node.kind}</span>
      <h2>${escapeHtml(node.label)}</h2>
      <div class="field">
        <div class="field-label">Full content</div>
        <div class="field-value">${escapeHtml(node.detail)}</div>
      </div>
      <div class="field">
        <div class="field-label">Tags</div>
        <div class="field-value">${tagsHtml}</div>
      </div>
      <div class="field">
        <div class="field-label">Source</div>
        <div class="field-value">${escapeHtml(node.source)}</div>
      </div>
      <div class="field">
        <div class="field-label">Created</div>
        <div class="field-value">${escapeHtml(node.created_at)}</div>
      </div>
      <div class="field">
        <div class="field-label">Connections</div>
        <div class="field-value">${node.degree}</div>
      </div>
    `;
    panel.classList.add("open");
  }

  document.getElementById("panel-close").addEventListener("click", () => {
    panel.classList.remove("open");
    selectedId = null;
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  // --- search ---
  searchEl.addEventListener("input", () => {
    searchQuery = searchEl.value.trim().toLowerCase();
  });

  // --- legend toggles ---
  document.querySelectorAll(".legend-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      const kind = btn.dataset.kind;
      if (hiddenKinds.has(kind)) {
        hiddenKinds.delete(kind);
        btn.classList.remove("off");
      } else {
        hiddenKinds.add(kind);
        btn.classList.add("off");
      }
    });
  });

  // --- build ---
  function buildGraph(data) {
    nodes = data.nodes.map((n) => ({ ...n }));
    byId = new Map(nodes.map((n) => [n.id, n]));
    edges = data.edges
      .map((e) => ({ ...e, a: byId.get(e.source), b: byId.get(e.target) }))
      .filter((e) => e.a && e.b);

    assignPositions(nodes);

    statsEl.textContent = `${nodes.length} memories · ${edges.length} connections`;
    emptyState.classList.toggle("hidden", nodes.length > 0);

    requestAnimationFrame(loop);
  }

  fetch("/graph/data")
    .then((r) => r.json())
    .then(buildGraph)
    .catch((err) => {
      emptyState.classList.remove("hidden");
      emptyState.innerHTML = `<div>Couldn't load the graph: ${escapeHtml(err.message)}</div>`;
      requestAnimationFrame(loop); // still render the empty globe
    });
})();
</script>
</body>
</html>
